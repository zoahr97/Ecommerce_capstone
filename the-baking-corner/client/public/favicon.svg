<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- רקע שחור פחם נקי ויוקרתי -->
  <circle cx="50" cy="50" r="50" fill="#0A0A0A" />

  <!-- מסגרת זהב מינימליסטית דקה במיוחד -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#D4AF37" stroke-width="1" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="0.5" />

  <!-- מונוגרמה (אותיות) יוקרתית -->
  <text x="50" y="58" font-family="'Didot', 'Bodoni MT', 'Times New Roman', serif" font-size="38" font-weight="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BC</text>

  <!-- כיתוב מוקטן ומינימליסטי -->
  <text x="50" y="75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="6" font-weight="300" fill="#D4AF37" text-anchor="middle" letter-spacing="3">BAKING CORNER</text>

  <!-- קו הפרדה עדין -->
  <line x1="35" y1="65" x2="65" y2="65" stroke="#D4AF37" stroke-width="0.5" />
</svg>
